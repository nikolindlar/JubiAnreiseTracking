{% extends "base.html" %}
{% block title %}Verwaltung – Anmelden{% endblock %}
{% block bodyclass %}admin{% endblock %}
{% block body %}
<main class="narrow">
  <h1>Verwaltung</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Passwort <input type="password" name="password" autofocus></label>
    <button type="submit">Anmelden</button>
  </form>
</main>
{% endblock %}
